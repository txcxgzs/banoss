# Nginx 反向代理配置示例（适用于 S3 接口 + OSS 管理控制台）
# 关键点：关闭请求/响应缓冲以支持大文件流式直传与断点续传下载，保留原始 Host 头以支持 SigV4 验签

server {
    listen 80;
    # 如需 Virtual-Hosted Style，可同时匹配通配符子域名：
    # server_name oss.example.com *.oss.example.com;
    server_name oss.example.com;

    # 允许上传任意大小对象
    client_max_body_size 0;

    # 关闭缓冲，流式透传到 BanOSS -> SFTP
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;

    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 宝塔面板站点 Nginx 配置规范模板（适配 BanOSS + Cloudflare）
# 使用方法：宝塔面板「网站」创建纯静态站点后，点站点「设置 -> 配置文件」，
# 用以下 location / 反代规则替换默认的静态规则（务必删除宝塔默认的 gif|jpg|png 和 js|css 正则块！）

server
{
    listen 80;
    listen 443 ssl http2;
    server_name oss.example.com;
    index index.html;
    root /www/wwwroot/oss.example.com;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    # 在宝塔面板 SSL 页申请 Let's Encrypt 或粘贴 Cloudflare 源服务器证书后，宝塔会自动填充证书路径
    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以允许或注释
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以允许或注释
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/oss.example.com.conf;
    #REWRITE-END

    # 禁止访问宝塔/项目敏感隐藏文件
    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README\.md|data)
    {
        return 404;
    }

    # 保留 Let's Encrypt 证书自动续签验证路径
    location ~ \.well-known{
        allow all;
    }

    # BanOSS 核心反向代理（关键：禁止加默认图片/JS静态规则，否则会拦截 S3 同后缀对象！）
    location /
    {
        proxy_pass http://127.0.0.1:9000;

        # 必须保留原始 Host 与端口，否则 AWS SigV4 验签会失败
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 允许大文件与流式传输（不落地缓冲）
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    access_log  /www/wwwlogs/oss.example.com.log;
    error_log   /www/wwwlogs/oss.example.com.error.log;
}
